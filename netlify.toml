[build]
  command = "node scripts/build-site.mjs"
  publish = "public"

[functions]
  directory = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

# /api/album/<pid> -> api-album 函数 (pid 走 query 透传)
[[redirects]]
  from = "/api/album/:pid"
  to = "/.netlify/functions/api-album?pid=:pid"
  status = 200

# /img?u=<url> -> img 函数 (query 参数自动透传)
[[redirects]]
  from = "/img"
  to = "/.netlify/functions/img"
  status = 200
